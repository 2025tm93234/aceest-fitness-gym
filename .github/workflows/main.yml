name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q aceest app.py
      - name: Lint with flake8
        run: python -m flake8 aceest app.py tests/

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .

  test:
    name: Automated Testing (inside container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:${{ github.sha }} pytest -v --cov=aceest

  version-matrix:
    name: Every release (inside container)
    runs-on: ubuntu-latest
    needs: docker-build
    strategy:
      fail-fast: false
      matrix:
        version: ["1.0", "1.1", "1.1.2", "2.0.1", "2.2.1", "2.2.4", "3.1.2", "3.2.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build --build-arg APP_VERSION=${{ matrix.version }} -t aceest-fitness:${{ matrix.version }} .
      - name: Run the release's tests inside the container
        run: docker run --rm aceest-fitness:${{ matrix.version }} pytest -q
      - name: Confirm the container reports its version
        run: |
          docker run -d --name probe -p 5000:5000 aceest-fitness:${{ matrix.version }}
          sleep 5
          curl -fs http://localhost:5000/version | grep '"version":"${{ matrix.version }}"'
          docker rm -f probe
