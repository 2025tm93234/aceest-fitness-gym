# Canary: ingress sends canary-weight percent of requests to the new release.
# Change the share: scripts/k8s.sh canary-weight 50
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary-stable
  template:
    metadata:
      labels:
        app: aceest-canary-stable
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary-new
  template:
    metadata:
      labels:
        app: aceest-canary-new
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-stable
  namespace: aceest
spec:
  selector:
    app: aceest-canary-stable
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-new
  namespace: aceest
spec:
  selector:
    app: aceest-canary-new
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-canary-stable
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-weighted
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-canary-new
                port:
                  number: 80
