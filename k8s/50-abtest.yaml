# A/B test: requests carrying header `X-Experiment: B` get variant B, everyone else variant A.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-variant-a
  template:
    metadata:
      labels:
        app: aceest-variant-a
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-variant-b
  template:
    metadata:
      labels:
        app: aceest-variant-b
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
  namespace: aceest
spec:
  selector:
    app: aceest-variant-a
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
  namespace: aceest
spec:
  selector:
    app: aceest-variant-b
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ab(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-variant-a
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: X-Experiment
    nginx.ingress.kubernetes.io/canary-by-header-value: B
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ab(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-variant-b
                port:
                  number: 80
