# Shadow (traffic mirroring): users are served by the primary release; an nginx
# mirror proxy silently copies every request to the shadow release and discards
# its response. Compare behaviour with: kubectl -n aceest logs deploy/aceest-shadow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-primary
  template:
    metadata:
      labels:
        app: aceest-primary
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  selector:
    app: aceest-primary
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-shadow
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-mirror-conf
  namespace: aceest
data:
  nginx.conf: |
    events {}
    http {
      upstream primary { server aceest-primary:80; }
      upstream shadow  { server aceest-shadow:80; }
      server {
        listen 8080;
        location / {
          mirror /mirror;
          mirror_request_body on;
          proxy_set_header Host $host;
          proxy_pass http://primary;
        }
        location = /mirror {
          internal;
          proxy_set_header X-Shadow-Request "true";
          proxy_set_header Host $host;
          proxy_pass http://shadow$request_uri;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-mirror
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-mirror
  template:
    metadata:
      labels:
        app: aceest-mirror
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: aceest-mirror-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-mirror
  namespace: aceest
spec:
  selector:
    app: aceest-mirror
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /shadow(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-mirror
                port:
                  number: 80
